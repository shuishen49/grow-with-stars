name: 打包安卓 APK

on:
  push:
    tags: ['v*']          # 打 tag（如 v1.0.0）时自动出正式包
    branches: [main]      # 平时 push 也出一份调试包，方便随时下载
  workflow_dispatch:      # 也可以在 GitHub 页面手动点「Run workflow」

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖
        run: npm ci

      # .env 不入库（里面有密钥），所以 Supabase 地址要在云端临时生成
      # 没配密钥也能出包，只是打出来的是「本机模式」版本：能用，但不能登录云同步
      - name: 写入 Supabase 配置
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::没配 Supabase 密钥，这个包只能用「本机模式」：不登录、不能跨设备同步。想要云同步就去 Settings → Secrets and variables → Actions 加上 VITE_SUPABASE_URL 和 VITE_SUPABASE_ANON_KEY，再跑一次。"
          else
            echo "Supabase 密钥已就位，这个包可以登录并云同步。"
          fi

      - name: 构建网页
        run: npm run build

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 装 JDK 21（AGP 8.13 + Gradle 8.14 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 每次都会现场生成一把新的 debug keystore，导致每份 APK 签名都不同，
      # 覆盖安装会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载重装（数据全丢）。
      # 这里把调试签名缓存起来，之后每次构建都用同一把，可以直接覆盖升级。
      - name: 固定调试签名（让新版能直接覆盖安装）
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 接受安卓 SDK 许可并补装组件
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 生成调试版 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 取个带日期的文件名
        id: name
        run: echo "file=家庭积分本-$(date +%Y%m%d)-debug.apk" >> $GITHUB_OUTPUT

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 家庭积分本-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 只有在仓库里配了签名密钥时才会跑，没配就跳过
      - name: 有签名密钥吗
        id: signed
        run: echo "yes=${{ secrets.KEYSTORE_BASE64 != '' }}" >> $GITHUB_OUTPUT

      - name: 解出签名文件
        if: steps.signed.outputs.yes == 'true'
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > family.jks

      - name: 生成正式签名版 APK
        if: steps.signed.outputs.yes == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/family.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 上传正式版
        if: steps.signed.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 家庭积分本-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Artifacts 藏在运行详情页最底下、还会过期，不好找。
      # 这里再做成 Release，打开仓库首页右边「Releases」就能直接下载。
      - name: 发布到 Releases 页面
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p out
          DATE=$(date +%Y%m%d)
          # 注意：runner 的 locale 是 C，文件名里的中文会被吞掉（只剩空字符串），
          # 所以附件名一律用 ASCII，中文只放在 Release 标题和说明里。
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/FamilyPoints-${DATE}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/FamilyPoints-${DATE}-release.apk"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="家庭积分本 ${GITHUB_REF_NAME}"
            PRE=""
          else
            TAG="latest"
            TITLE="家庭积分本 最新调试版"
            PRE="--prerelease"
            # latest 是滚动标签：先删掉旧的再建新的（正式 tag 不删）
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          fi
          gh release create "$TAG" $PRE \
            --title "$TITLE" \
            --notes "GitHub Actions 自动打包（$(date '+%Y-%m-%d %H:%M') UTC，源码 ${GITHUB_SHA::7}）。调试版可直接安装；未配置 Supabase 密钥时打出来的是「本机模式」，能记账看日历但不能登录云同步。平板建议横屏，且分辨率需达 1100 CSS 像素以上才显示双栏布局。" \
            out/*.apk

name: 打包安卓 APK

on:
  push:
    tags: ['v*']          # 打 tag（如 v1.0.0）时自动出正式包
    branches: [main]      # 平时 push 也出一份调试包，方便随时下载
  workflow_dispatch:      # 也可以在 GitHub 页面手动点「Run workflow」

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖
        run: npm ci

      # .env 不入库（里面有密钥），所以 Supabase 地址要在云端临时生成
      - name: 检查 Supabase 密钥配了吗
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::仓库还缺 Actions 密钥 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY。到 Settings → Secrets and variables → Actions 添加后再重跑。"
            exit 1
          fi

      - name: 写入 Supabase 配置
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF

      - name: 构建网页
        run: npm run build

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 装 JDK 21（AGP 8.13 + Gradle 8.14 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受安卓 SDK 许可并补装组件
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 生成调试版 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 取个带日期的文件名
        id: name
        run: echo "file=家庭积分本-$(date +%Y%m%d)-debug.apk" >> $GITHUB_OUTPUT

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 家庭积分本-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 只有在仓库里配了签名密钥时才会跑，没配就跳过
      - name: 有签名密钥吗
        id: signed
        run: echo "yes=${{ secrets.KEYSTORE_BASE64 != '' }}" >> $GITHUB_OUTPUT

      - name: 解出签名文件
        if: steps.signed.outputs.yes == 'true'
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > family.jks

      - name: 生成正式签名版 APK
        if: steps.signed.outputs.yes == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/family.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 上传正式版
        if: steps.signed.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 家庭积分本-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

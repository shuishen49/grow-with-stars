name: 打包安卓 APK

on:
  push:
    tags: ['v*']          # 打 tag（如 v1.0.0）时自动出正式包
    branches: [main]      # 平时 push 也出一份调试包，方便随时下载
  workflow_dispatch:      # 也可以在 GitHub 页面手动点「Run workflow」

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖
        run: npm ci

      # .env 不入库（里面有密钥），所以 Supabase 地址要在云端临时生成
      # 没配密钥也能出包，只是打出来的是「本机模式」版本：能用，但不能登录云同步
      - name: 写入 Supabase 配置
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::没配 Supabase 密钥，这个包只能用「本机模式」：不登录、不能跨设备同步。想要云同步就去 Settings → Secrets and variables → Actions 加上 VITE_SUPABASE_URL 和 VITE_SUPABASE_ANON_KEY，再跑一次。"
          else
            echo "Supabase 密钥已就位，这个包可以登录并云同步。"
          fi

      # 版本号打进网页里（VITE_BUILD_ID），热更新就靠它判断「是不是最新版」：
      # 刚装的 APK 自带的版本号和清单一致 → 不提示更新；之后的构建才提示。
      - name: 构建网页
        run: |
          set -e
          export VITE_BUILD_ID="$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "本次构建版本: $VITE_BUILD_ID"
          echo "$VITE_BUILD_ID" > .build_id
          npm run build

      # 热更新包：把网页成品打成 zip，再写一份带「更新内容」的清单。
      # App 启动或手动点「检查更新」时读这个清单，有新版本就先把内容显示给用户看。
      - name: 打热更新包
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p out
          (cd dist && zip -qr ../out/hot-bundle.zip .)
          node -e "
            const fs = require('fs');
            const cp = require('child_process');
            const id = fs.readFileSync('.build_id', 'utf8').trim();
            const isTag = process.env.GITHUB_REF_TYPE === 'tag';
            // 主地址用仓库 hot 分支的 raw 直连（国内实测可达；Releases 附件走的
            // objects.githubusercontent.com 在国内经常拉不到），附件作备用。
            // 也不能用 releases/latest/download：latest 只认非 prerelease，会 404。
            const base = 'https://github.com/shuishen49/grow-with-stars/releases';
            const rawBase = 'https://raw.githubusercontent.com/shuishen49/grow-with-stars/hot';
            const releaseUrl = base + '/download/' + (isTag ? process.env.GITHUB_REF_NAME : 'latest') + '/hot-bundle.zip';
            const urls = [rawBase + '/hot-bundle.zip', releaseUrl];
            // 更新说明：仓库里有 HOTUPDATE.md 就用它，只认「- xxx」/「* xxx」开头的行，
            // 正文里的说明文字不算（之前把说明也当成了更新条目，App 里显示了一堆废话）。
            let notes = [];
            try {
              notes = fs.readFileSync('HOTUPDATE.md', 'utf8').split('\n')
                .map(s => s.trim())
                .filter(s => /^[-*]\s+\S/.test(s))
                .map(s => s.replace(/^[-*]\s*/, '').trim())
                .filter(Boolean);
            } catch (e) { /* 没有这个文件就忽略 */ }
            if (!notes.length) {
              notes = cp.execSync('git log --pretty=%s -n 5').toString().trim().split('\n').filter(Boolean);
            }
            const info = { version: id, url: urls[0], urls, notes, publishedAt: new Date().toISOString().slice(0, 10) };
            fs.writeFileSync('out/hot-update.json', JSON.stringify(info, null, 2));
            console.log('热更新清单:', JSON.stringify(info, null, 2));
          "
          ls -la out/

      # GitHub Releases 的附件（objects.githubusercontent.com）在国内经常拉不到，
      # 而 raw.githubusercontent.com 实测是通的。所以把热更新包同步放进仓库的
      # hot 分支：孤儿分支、每次构建整体覆盖 force push，不会让仓库历史无限膨胀。
      - name: 热更新包放进 hot 分支（raw 直连用）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BUILD_ID=$(cat .build_id)
          REPO_DIR=$(mktemp -d)
          cd "$REPO_DIR"
          git init -q -b hot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/shuishen49/grow-with-stars.git"
          cp "$GITHUB_WORKSPACE/out/hot-bundle.zip" .
          cp "$GITHUB_WORKSPACE/out/hot-update.json" .
          git add -A
          git commit -q -m "热更新包 $BUILD_ID"
          git push -q origin hot --force
          echo "hot 分支已更新（$BUILD_ID）"

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 装 JDK 21（AGP 8.13 + Gradle 8.14 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 每次都会现场生成一把新的 debug keystore，导致每份 APK 签名都不同，
      # 覆盖安装会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载重装（数据全丢）。
      #
      # 试过用 actions/cache 缓存 ~/.android/debug.keystore，实测没生效（签名照样变）。
      # 改成：第一次构建时用 keytool 生成，然后提交回仓库；之后的构建直接复用。
      # debug keystore 不含任何机密，签出来的只是调试版 APK，进仓库是安全的做法。
      - name: 固定调试签名（没有就生成并存回仓库）
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -f debug.keystore ]; then
            echo "已有 debug.keystore，沿用同一把签名。"
          else
            echo "没有 debug.keystore，现在生成一把并提交回仓库…"
            keytool -genkeypair -v -keystore debug.keystore -storetype PKCS12 \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 11000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f debug.keystore
            # [skip ci] 避免这次提交再触发一次构建
            git commit -m "[skip ci] 固定调试签名 keystore，保证每次打包签名一致"
            git push
            echo "已提交回仓库，之后的构建签名都会一致。"
          fi

      - name: 接受安卓 SDK 许可并补装组件
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 生成调试版 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 防复发：之前 build.gradle 里把路径写成 file('debug.keystore')，
      # Gradle 会去 android/app 下找，永远找不到，于是每次都用临时签名，
      # 覆盖安装一直报 INSTALL_FAILED_UPDATE_INCOMPATIBLE。这里对着证书指纹核一遍。
      - name: 确认 APK 用的是仓库里那把签名
        working-directory: android
        run: |
          KS_CERT=$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ' :' | tr 'A-Z' 'a-z')
          APK_CERT=$(${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk 2>/dev/null \
            | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ' :' | tr 'A-Z' 'a-z')
          echo "keystore: $KS_CERT"
          echo "apk     : $APK_CERT"
          if [ -n "$KS_CERT" ] && [ "$KS_CERT" = "$APK_CERT" ]; then
            echo "✓ 这个 APK 用的是仓库里那把 debug.keystore，可以直接覆盖安装"
          else
            echo "::warning::APK 签名和仓库 keystore 不一致，覆盖安装会失败。请检查 android/app/build.gradle 里的 rootProject.file('debug.keystore')。"
          fi

      - name: 取个带日期的文件名
        id: name
        run: echo "file=家庭积分本-$(date +%Y%m%d)-debug.apk" >> $GITHUB_OUTPUT

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 家庭积分本-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 只有在仓库里配了签名密钥时才会跑，没配就跳过
      - name: 有签名密钥吗
        id: signed
        run: echo "yes=${{ secrets.KEYSTORE_BASE64 != '' }}" >> $GITHUB_OUTPUT

      - name: 解出签名文件
        if: steps.signed.outputs.yes == 'true'
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > family.jks

      - name: 生成正式签名版 APK
        if: steps.signed.outputs.yes == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/family.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 上传正式版
        if: steps.signed.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 家庭积分本-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Artifacts 藏在运行详情页最底下、还会过期，不好找。
      # 这里再做成 Release，打开仓库首页右边「Releases」就能直接下载。
      - name: 发布到 Releases 页面
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p out
          DATE=$(date +%Y%m%d)
          # 注意：runner 的 locale 是 C，文件名里的中文会被吞掉（只剩空字符串），
          # 所以附件名一律用 ASCII，中文只放在 Release 标题和说明里。
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/FamilyPoints-${DATE}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/FamilyPoints-${DATE}-release.apk"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="家庭积分本 ${GITHUB_REF_NAME}"
            PRE=""
          else
            TAG="latest"
            TITLE="家庭积分本 最新调试版"
            PRE="--prerelease"
            # latest 是滚动标签：先删掉旧的再建新的（正式 tag 不删）
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          fi
          # 热更新用的两个文件也一起发（App 靠它们实现不重装升级）
          FILES="out/FamilyPoints-${DATE}-debug.apk out/hot-bundle.zip out/hot-update.json"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            FILES="$FILES out/FamilyPoints-${DATE}-release.apk"
          fi
          gh release create "$TAG" $PRE \
            --title "$TITLE" \
            --notes "GitHub Actions 自动打包（$(date '+%Y-%m-%d %H:%M') UTC，源码 ${GITHUB_SHA::7}）。调试版可直接安装；未配置 Supabase 密钥时打出来的是「本机模式」，能记账看日历但不能登录云同步。平板建议横屏，且分辨率需达 1100 CSS 像素以上才显示双栏布局。hot-bundle.zip + hot-update.json 是热更新用的，装过 App 之后点「规则 → 检查更新」即可升级。" \
            $FILES

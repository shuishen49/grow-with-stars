name: Build HarmonyOS package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-harmony.yml'
      - 'harmony/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build React web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build
          rm -rf harmony/entry/src/main/resources/rawfile
          mkdir -p harmony/entry/src/main/resources/rawfile
          cp -R dist/. harmony/entry/src/main/resources/rawfile/
          sed -i -e 's#href="/#href="#g' -e 's#src="/#src="#g' harmony/entry/src/main/resources/rawfile/index.html

      - name: Download Harmony command-line tools
        env:
          HARMONY_TOOLS_URL: ${{ secrets.HARMONY_TOOLS_URL }}
        run: |
          test -n "$HARMONY_TOOLS_URL" || (echo 'Set HARMONY_TOOLS_URL in repository secrets.' && exit 1)
          curl -fL "$HARMONY_TOOLS_URL" -o /tmp/harmony-tools.zip
          mkdir -p "$RUNNER_TEMP/harmony-tools"
          unzip -q /tmp/harmony-tools.zip -d "$RUNNER_TEMP/harmony-tools"
          echo "HARMONY_TOOLS_ROOT=$RUNNER_TEMP/harmony-tools" >> "$GITHUB_ENV"
          SDK_HOME="$(find "$RUNNER_TEMP/harmony-tools" -maxdepth 4 -type d \( -name sdk -o -name Sdk \) | head -1)"
          if [ -z "$SDK_HOME" ]; then
            echo "::error::The command-line tools archive does not contain a HarmonyOS SDK. Use an archive that includes the SDK or add an SDK download step."
            exit 1
          fi
          echo "DEVECO_SDK_HOME=$SDK_HOME" >> "$GITHUB_ENV"
          echo "Harmony SDK: $SDK_HOME"

      - name: Install Harmony dependencies
        working-directory: harmony
        run: |
          "$HARMONY_TOOLS_ROOT/command-line-tools/bin/ohpm" install

      - name: Configure Harmony release signing
        env:
          HARMONY_KEYSTORE_B64: ${{ secrets.HARMONY_KEYSTORE_B64 }}
          HARMONY_CERT_B64: ${{ secrets.HARMONY_CERT_B64 }}
          HARMONY_PROFILE_B64: ${{ secrets.HARMONY_PROFILE_B64 }}
          HARMONY_STORE_PASSWORD: ${{ secrets.HARMONY_STORE_PASSWORD }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
        run: |
          for required in HARMONY_KEYSTORE_B64 HARMONY_CERT_B64 HARMONY_PROFILE_B64 HARMONY_STORE_PASSWORD HARMONY_KEY_PASSWORD HARMONY_KEY_ALIAS; do
            if [ -z "${!required}" ]; then
              echo "::error::Missing GitHub Actions secret: $required"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/harmony-signing"
          printf '%s' "$HARMONY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/harmony-signing/release.p12"
          printf '%s' "$HARMONY_CERT_B64" | base64 --decode > "$RUNNER_TEMP/harmony-signing/release.cer"
          printf '%s' "$HARMONY_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/harmony-signing/release.p7b"
          if grep -q 'BEGIN CERTIFICATE' "$RUNNER_TEMP/harmony-signing/release.cer"; then
            awk 'BEGIN { block=0 } /BEGIN CERTIFICATE/ { block++ } { lines[block] = lines[block] $0 ORS } END { printf "%s", lines[block] }' "$RUNNER_TEMP/harmony-signing/release.cer" > "$RUNNER_TEMP/harmony-signing/release-leaf.cer"
            mv "$RUNNER_TEMP/harmony-signing/release-leaf.cer" "$RUNNER_TEMP/harmony-signing/release.cer"
          fi
          keytool -list -v -keystore "$RUNNER_TEMP/harmony-signing/release.p12" -storepass "$HARMONY_STORE_PASSWORD" -alias "$HARMONY_KEY_ALIAS" > "$RUNNER_TEMP/harmony-signing/keytool.txt"
          grep -q 'Entry type: PrivateKeyEntry' "$RUNNER_TEMP/harmony-signing/keytool.txt" || (echo '::error::The P12 does not contain a private key entry.' && exit 1)
          grep -q 'Alias name: releaseKey' "$RUNNER_TEMP/harmony-signing/keytool.txt" || (echo '::error::The P12 alias is not releaseKey.' && exit 1)
          grep -a -q 'com.huyongxin.growwithstars' "$RUNNER_TEMP/harmony-signing/release.p7b" || (echo '::error::The Profile does not contain bundle com.huyongxin.growwithstars.' && exit 1)
          export HARMONY_SIGNING_DIR="$RUNNER_TEMP/harmony-signing"
          node <<'NODE'
          const fs = require('fs');
          const path = 'harmony/build-profile.json5';
          const profile = JSON.parse(fs.readFileSync(path, 'utf8'));
          profile.app.signingConfigs = [{
            name: 'release',
            type: 'HarmonyOS',
            material: {
              storePassword: process.env.HARMONY_STORE_PASSWORD,
              certpath: `${process.env.HARMONY_SIGNING_DIR}/release.cer`,
              keyAlias: process.env.HARMONY_KEY_ALIAS,
              keyPassword: process.env.HARMONY_KEY_PASSWORD,
              profile: `${process.env.HARMONY_SIGNING_DIR}/release.p7b`,
              signAlg: 'SHA256withECDSA',
              storeFile: `${process.env.HARMONY_SIGNING_DIR}/release.p12`
            }
          }];
          profile.app.products = profile.app.products.map(product => ({ ...product, signingConfig: 'release' }));
          fs.writeFileSync(path, JSON.stringify(profile, null, 2) + '\n');
          NODE

      - name: Build HAP
        working-directory: harmony
        run: |
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          test -d "$DEVECO_SDK_HOME" || (echo 'DEVECO_SDK_HOME is missing.' && exit 1)
          set +e
          "$HARMONY_TOOLS_ROOT/command-line-tools/bin/hvigorw" --mode module -p product=default -p module=entry@default -p buildMode=release assembleHap 2>&1 | tee "$RUNNER_TEMP/hvigor-build.log"
          code=${PIPESTATUS[0]}
          cat "$RUNNER_TEMP/hvigor-build.log"
          if [ "$code" -ne 0 ]; then
            echo 'Harmony build failed; last compiler lines:'
            grep -Ei 'error|failed|exception|arkts|\.ets|line [0-9]+' "$RUNNER_TEMP/hvigor-build.log" | tail -n 40 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Hvigor::$line"
            done
            find .hvigor/outputs/build-logs -type f -print 2>/dev/null | while IFS= read -r log; do
              grep -Ein 'error|failed|exception|sign|cert|profile|p12|password|0030' "$log" | tail -n 80 | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=Hvigor detail::$log $line"
              done
            done
          fi
          exit "$code"

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: trickster-points-harmony-hap
          path: harmony/entry/build/**/*.hap

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trickster-points-harmony-build-log
          path: |
            ${{ runner.temp }}/hvigor-build.log
            harmony/.hvigor/outputs/build-logs/**

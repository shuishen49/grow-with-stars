<!--
   Supabase 控制台 → Authentication → Emails →「Magic Link / OTP」模板
   · 主题(Subject) 填： 【家庭积分本】登录验证码
   · 正文 粘贴下面 <body> 里那一整段 HTML
   关键：正文里必须出现 {{ .Token }}（不是 {{ .ConfirmationURL }}），这样才会发 6 位数字验证码。
-->
<div style="background:#F8F6F0;padding:24px 12px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #E8EAF4;border-radius:20px;padding:28px;">

    <div style="font-size:18px;font-weight:700;color:#202B49;">🏅 家庭积分本</div>
    <div style="font-size:13px;color:#6F7D96;margin-top:4px;">好习惯 · 好学习 · 每天进步一点点</div>

    <div style="font-size:14px;color:#202B49;margin-top:22px;">
      你正在登录，请输入下面的 6 位验证码：
    </div>

    <div style="background:#F0EBFF;border-radius:12px;padding:18px;margin-top:14px;text-align:center;">
      <span style="font-size:34px;font-weight:700;letter-spacing:8px;color:#5738E8;font-family:Menlo,Consolas,'Courier New',monospace;">{{ .Token }}</span>
    </div>

    <div style="font-size:12px;color:#6F7D96;margin-top:16px;line-height:1.8;">
      验证码 <b style="color:#202B49;">60 分钟</b> 内有效，只能使用一次。<br>
      如果不是你本人操作，直接忽略这封邮件就好，积分不会有任何变化。
    </div>

    <div style="border-top:1px dashed #E8EAF4;margin-top:22px;padding-top:14px;font-size:11px;color:#9AA5B8;">
      本邮件由系统自动发送，请勿直接回复。
    </div>

  </div>
</div>
